{% extends "base.html" %}

{% block title %}Update Event{% endblock title %}

{% block content %}
  <div class="container mx-auto px-6 py-10 sm:py-12">
    <div class="flex items-end justify-between gap-4">
      <div>
        <p class="text-xs font-bold tracking-widest text-slate-500">EVENT</p>
        <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Update event</h1>
      </div>
      <a class="btn-outline" href="{% url 'user' %}">Back</a>
    </div>

    <div class="mt-8 max-w-2xl">
      <div class="card">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn-primary">Save changes</button>
        </form>
      </div>
    </div>
  </div>
{% endblock content %}
